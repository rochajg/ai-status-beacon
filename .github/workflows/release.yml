name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod

      - name: Build
        working-directory: host
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../dist/beacon-${{ matrix.suffix }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.suffix }}
          path: dist/beacon-${{ matrix.suffix }}

  firmware:
    name: Package firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip firmware
        run: zip -j dist/firmware.zip firmware/main.py firmware/states.py firmware/hardware.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/firmware.zip

  release:
    name: Create release
    needs: [build, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum beacon-darwin-arm64 beacon-darwin-amd64 firmware.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Status Beacon ${{ github.ref_name }}"
          body: |
            ## Install

            ### macOS (Apple Silicon)
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/beacon-darwin-arm64 -o ~/.local/bin/beacon
            chmod +x ~/.local/bin/beacon
            ```

            ### macOS (Intel)
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/beacon-darwin-amd64 -o ~/.local/bin/beacon
            chmod +x ~/.local/bin/beacon
            ```

            ### One-liner (auto-detects arch)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```

            ---
            See [README](https://github.com/${{ github.repository }}#readme) for full setup instructions.
          files: |
            dist/beacon-darwin-arm64
            dist/beacon-darwin-amd64
            dist/firmware.zip
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
