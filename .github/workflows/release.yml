name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          cd host && go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../dist/ai-beacon-${{ matrix.suffix }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-beacon-${{ matrix.suffix }}
          path: dist/ai-beacon-${{ matrix.suffix }}

  firmware:
    name: Build firmware (UF2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls pico-sdk and its own submodules

      - name: Install ARM GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Install CMake + Ninja
        run: sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Build
        run: |
          mkdir -p firmware/build
          cd firmware/build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja beacon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/build/beacon.uf2

  release:
    name: Create release
    needs: [build, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ai-beacon-darwin-arm64 ai-beacon-darwin-amd64 beacon.uf2 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Status Beacon ${{ github.ref_name }}"
          body: |
            ## Install

            ### macOS (Apple Silicon)
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ai-beacon-darwin-arm64 -o ~/.local/bin/beacon
            chmod +x ~/.local/bin/beacon
            ```

            ### macOS (Intel)
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ai-beacon-darwin-amd64 -o ~/.local/bin/beacon
            chmod +x ~/.local/bin/beacon
            ```

            ### One-liner (auto-detects arch)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```

            ### Flash the firmware
            Download `beacon.uf2`, hold BOOT on the RP2040 Zero, plug in via USB, and drag `beacon.uf2` to the `RPI-RP2` drive. No MicroPython required.

            ---
            See [README](https://github.com/${{ github.repository }}#readme) for full setup instructions.
          files: |
            dist/ai-beacon-darwin-arm64
            dist/ai-beacon-darwin-amd64
            dist/beacon.uf2
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
